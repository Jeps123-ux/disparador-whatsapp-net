functionsDirectory = "/opt/build/repo/netlify/functions"
functionsDirectoryOrigin = "default"
headersOrigin = "config"
redirectsOrigin = "config"
plugins = []


[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

[database.migrations]
  path = "netlify/database/migrations"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/conexao"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/disparo"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/contatos"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/grupos"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/historico"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/historico/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/configuracoes"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200
