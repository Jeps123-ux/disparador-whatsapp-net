# This repository contains a pre-built static site (index.html + assets/),
# so there is no build step: Netlify publishes the repository root as-is.
[build]
  publish = "."
  command = "echo 'Pre-built site, no build step'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/conexao"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/disparo"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/contatos"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/grupos"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/historico"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/historico/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/configuracoes"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200
